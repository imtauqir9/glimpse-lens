global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: glimpse-api
    metrics_path: /metrics
    # /metrics is admin-gated; the token is written to /tmp/prom_token at container
    # start from $ADMIN_TOKEN (see docker-compose prometheus entrypoint).
    authorization:
      type: Bearer
      credentials_file: /tmp/prom_token
    # Pointed at the DEPLOYED app. The dashboard panels are unfiltered `sum(...)`,
    # so scraping prod and a local api at the same time would double-count every
    # number — hence one active target, not two jobs.
    # Local dev instead: swap the two blocks below (drop `scheme`, use api:8000).
    scheme: https
    static_configs:
      - targets: ['glimpse-lens.fly.dev']
        labels: { service: glimpse, env: fly }
    # - targets: ['api:8000']
    #   labels: { service: glimpse, env: local }

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: glimpse-api
    metrics_path: /metrics
    # /metrics is admin-gated; the token is written to /tmp/prom_token at container
    # start from $ADMIN_TOKEN (see docker-compose prometheus entrypoint).
    authorization:
      type: Bearer
      credentials_file: /tmp/prom_token
    static_configs:
      - targets: ['api:8000']
        labels: { service: glimpse }

# Local dev stack. Durable state lives in managed services from .env — Neon
# (DATABASE_URL), object storage, Qdrant Cloud, Prefect Cloud for the work
# queue — so every container here is stateless and disposable.
#   docker compose up --build
#   API + UI:        http://localhost:8000
#   Run/queue view:  https://app.prefect.cloud -> Runs
# Vector store is Qdrant Cloud via QDRANT_URL in .env. To run a local Qdrant
# instead, add a qdrant service here and blank QDRANT_URL.
services:
  # The inference service: ONE warm CLIP model behind a URL. api + worker send
  # batches here instead of each flow run paying a fresh ~15-30s model load.
  # Scaling embedding = scaling THIS service (CPU here; same container on a
  # GPU machine later — only CLIP_SERVICE_URL changes).
  clip:
    build: .
    command: uvicorn src.clip_service:app --host 0.0.0.0 --port 8001
    env_file: .env
    volumes:
      - hf_cache:/root/.cache     # model weights cached across restarts
    restart: unless-stopped

  # STARTUP GATE — indexes the four sample talks and exits. api + worker wait
  # for it to finish (service_completed_successfully), so the UI is NEVER
  # reachable with a half-indexed corpus: when localhost:8000 answers, the
  # samples are ready. Idempotent + durable (Qdrant Cloud) — after the first
  # successful run this exits in seconds. First run takes a few minutes
  # (model download + 4 videos); watch its logs: docker compose logs -f seed
  seed:
    build: .
    command: python -m src.seed
    env_file: .env
    environment:
      CLIP_SERVICE_URL: ${CLIP_SERVICE_URL:-http://clip:8001}
    volumes:
      - ./data:/app/data
      - hf_cache:/root/.cache
    depends_on:
      - clip
    restart: "no"

  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      CLIP_SERVICE_URL: ${CLIP_SERVICE_URL:-http://clip:8001}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}   # cluster-wide rate-limit + metrics
    volumes:
      - ./data:/app/data          # STORAGE_PROVIDER=local only (dev)
      - hf_cache:/root/.cache
    depends_on:
      clip:
        condition: service_started
      seed:
        condition: service_completed_successfully   # UI up only after samples ready
    restart: unless-stopped

  worker:
    build: .
    command: python -m src.worker
    env_file: .env
    environment:
      CLIP_SERVICE_URL: ${CLIP_SERVICE_URL:-http://clip:8001}
      # One worker process executes up to WORKER_CONCURRENCY runs at once.
      # With the clip service doing the embedding, each run is light
      # (download + ffmpeg only) — raise this without adding RAM for models.
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Prefect's runner long-polls for scheduled runs; the 10s default is dead
      # time on every single ingest and dominates a short backfill's wall clock
      # (the denominator of the chunks/s SLA). PROCESS_LIMIT is a SECOND cap on
      # concurrent flow-run subprocesses — leave it below WORKER_CONCURRENCY and
      # raising concurrency does nothing.
      PREFECT_RUNNER_POLL_FREQUENCY: ${PREFECT_RUNNER_POLL_FREQUENCY:-2}
      PREFECT_RUNNER_PROCESS_LIMIT: ${PREFECT_RUNNER_PROCESS_LIMIT:-8}
    volumes:
      - ./data:/app/data
      - hf_cache:/root/.cache
    depends_on:
      clip:
        condition: service_started
      seed:
        condition: service_completed_successfully
    restart: unless-stopped
    # Need more throughput? Replicas multiply it (all share the one clip model):
    #   docker compose up -d --scale worker=2   (-> 8 sources at once)
    # The throughput SLA in benchmark/bench.py is specified at >=2 workers, so
    # scale to 2 before running it. Replicas only help now that text embedding
    # no longer serializes behind the CLIP lock (src/rag/embeddings.py).

  # Cluster-wide state for rate limiting + metrics counters (Phase 2).
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # Monitoring (Phase 3): Prometheus scrapes /metrics; Grafana visualizes it.
  prometheus:
    image: prom/prometheus:latest
    env_file: .env   # for $ADMIN_TOKEN (the /metrics scrape is admin-gated)
    entrypoint:
      - /bin/sh
      - -c
      - 'printf "%s" "$$ADMIN_TOKEN" > /tmp/prom_token && exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  hf_cache:
